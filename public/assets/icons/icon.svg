<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Recap Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121215"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A87BFF"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#E3B84E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- film frame -->
  <rect x="120" y="150" width="272" height="212" rx="28" fill="none" stroke="url(#signal)" stroke-width="14"/>

  <!-- perforations -->
  <g fill="#FFFFFF" opacity="0.55">
    <rect x="140" y="176" width="14" height="22" rx="5"/>
    <rect x="140" y="216" width="14" height="22" rx="5"/>
    <rect x="140" y="256" width="14" height="22" rx="5"/>
    <rect x="140" y="296" width="14" height="22" rx="5"/>
    <rect x="358" y="176" width="14" height="22" rx="5"/>
    <rect x="358" y="216" width="14" height="22" rx="5"/>
    <rect x="358" y="256" width="14" height="22" rx="5"/>
    <rect x="358" y="296" width="14" height="22" rx="5"/>
  </g>

  <!-- play triangle -->
  <path d="M232 206 L306 256 L232 306 Z" fill="url(#signal)"/>

  <!-- audio ticks -->
  <g fill="#E3B84E" opacity="0.9">
    <rect x="176" y="392" width="10" height="34" rx="5"/>
    <rect x="200" y="378" width="10" height="62" rx="5"/>
    <rect x="224" y="392" width="10" height="34" rx="5"/>
    <rect x="248" y="370" width="10" height="78" rx="5"/>
    <rect x="272" y="386" width="10" height="46" rx="5"/>
    <rect x="296" y="374" width="10" height="70" rx="5"/>
    <rect x="320" y="392" width="10" height="34" rx="5"/>
  </g>
</svg>
