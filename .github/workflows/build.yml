name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build:
    name: Build standalone bundle
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch FFmpeg core binaries
        run: npm run fetch:ffmpeg

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          # Standalone server + static assets + public files.
          cp -r .next/standalone/. dist/
          mkdir -p dist/.next
          cp -r .next/static dist/.next/static
          if [ -d public ]; then cp -r public dist/public; fi
          tar -czf recap-studio-standalone.tar.gz -C dist .
          ls -lh recap-studio-standalone.tar.gz

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: recap-studio-standalone
          path: recap-studio-standalone.tar.gz
          retention-days: 30

      - name: Upload ffmpeg core artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core
          path: |
            public/ffmpeg/ffmpeg-core.js
            public/ffmpeg/ffmpeg-core.wasm
          retention-days: 30
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: recap-studio-standalone
          path: .

      - name: Download ffmpeg core artifact
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-core
          path: ffmpeg-core
        continue-on-error: true

      - name: Package ffmpeg core
        run: |
          set -euo pipefail
          if [ -f ffmpeg-core/ffmpeg-core.wasm ]; then
            tar -czf ffmpeg-core-${{ github.ref_name }}.tar.gz -C ffmpeg-core .
            ls -lh ffmpeg-core-${{ github.ref_name }}.tar.gz
          else
            echo "No ffmpeg core artifact found; skipping."
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Recap Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            recap-studio-standalone.tar.gz
            ffmpeg-core-*.tar.gz
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  relay:
    name: Validate Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Syntax check the relay
        run: node --check cloudflare-worker/index.js
